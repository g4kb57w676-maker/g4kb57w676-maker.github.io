<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ALFRED · Tesla</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070B16;color:#E8EEF9;font-family:-apple-system,system-ui,sans-serif}
main{max-width:560px;padding:32px}
h1{font-size:22px;margin:0 0 12px}
p{color:#9AA8C7;line-height:1.5}
code{display:block;word-break:break-all;background:#111B36;border:1px solid #24345E;border-radius:12px;padding:16px;font-size:15px;color:#E8EEF9;margin:16px 0}
button{background:#2F6BFF;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px}
</style>
</head>
<body>
<main>
<h1>ALFRED · autorización de Tesla</h1>
<p id="msg">Esta página solo muestra el código que te dio Tesla. No lo envía a ningún lado.</p>
<code id="code">—</code>
<button type="button" id="copy">Copiar código</button>
<p>Copialo y pegalo en la Terminal de la Mac, donde ALFRED te lo pide. Vence en unos minutos.</p>
</main>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code'), err = q.get('error');
document.getElementById('code').textContent = code || (err ? 'Error: ' + err : 'No hay código en esta dirección.');
document.getElementById('copy').onclick = () => code && navigator.clipboard.writeText(code).then(() => { document.getElementById('copy').textContent = 'Copiado'; });
history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
